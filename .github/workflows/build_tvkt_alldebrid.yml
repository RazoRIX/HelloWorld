name: Build PlayTorrio TV KT AllDebrid

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone and patch PlayTorrioTVKT
        run: |
          SCRIPT=$(find . -name "apply_alldebrid_tvkt.py" -type f | head -n 1)
          echo "Found patcher: $SCRIPT"
          test -n "$SCRIPT"
          python3 "$SCRIPT" --clone PlayTorrioTVKT-AllDebrid

      - name: Create signing keystore
        working-directory: PlayTorrioTVKT-AllDebrid
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -storepass playtorrio123 \
            -keypass playtorrio123 \
            -alias playtorrio \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=PlayTorrio AllDebrid, OU=TV, O=Local Build, L=NA, S=NA, C=US"

      - name: Build release APKs
        working-directory: PlayTorrioTVKT-AllDebrid
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p apk-output
          find PlayTorrioTVKT-AllDebrid/app/build/outputs/apk/release -name "*.apk" -exec cp {} apk-output/ \;
          ls -lah apk-output

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrioTVKT-AllDebrid-APKs
          path: apk-output/*.apk
          if-no-files-found: error
